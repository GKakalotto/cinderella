<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>Cinderella</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        #app {
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            margin-left: 20px;
        }

        label {
            margin-bottom: 20px;
        }

        input {
            margin-left: 20px;
        }

        button {
            width: 100px;
            height: 35px;
            border-radius: 5px;
            background-color: #409EFF;
            border: none;
            margin-left: 20px;
            color: white;
        }

        .switch-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .switch-row label {
            margin-bottom: 0;
        }

        .switch-text {
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            margin-left: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
            margin: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #ccc;
            border-radius: 24px;
            transition: .3s;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: .3s;
        }

        .switch input:checked + .slider {
            background-color: #409EFF;
        }

        .switch input:checked + .slider::before {
            transform: translateX(20px);
        }
    </style>
</head>

<body>
    <div id="app">
        <label>上班时间<input type="time" id="morning"></label>
        <label>午休时间<input type="time" id="noon"></label>
        <label>下班时间<input type="time" id="afternoon"></label>
        <div class="switch-row">
            <label for="popup" class="switch-text">显示弹窗</label>
            <label class="switch">
                <input type="checkbox" id="popup">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <button type="button" id="save">保存设置</button>
    <button type="button" id="test">通知测试</button>

    <script src="main.js"></script>
</body>

</html>
